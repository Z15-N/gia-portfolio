<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 272" role="img" aria-label="Buzz the bee wearing a graduation cap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c21a"/><stop offset="1" stop-color="#ffd866"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff3c4" stop-opacity=".9"/><stop offset="1" stop-color="#f6c21a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="240" height="272" fill="url(#bg)"/>
  <rect width="240" height="272" fill="url(#glow)"/>
  <!-- faint honeycomb -->
  <g fill="none" stroke="#2b2416" stroke-opacity=".08" stroke-width="2">
    <path d="M40 30l20-12 20 12v24l-20 12-20-12zM120 30l20-12 20 12v24l-20 12-20-12zM200 30l20-12 20 12v24l-20 12-20-12z"/>
    <path d="M0 90l20-12 20 12v24l-20 12-20-12zM80 90l20-12 20 12v24l-20 12-20-12zM160 90l20-12 20 12v24l-20 12-20-12z"/>
    <path d="M40 210l20-12 20 12v24l-20 12-20-12zM200 210l20-12 20 12v24l-20 12-20-12z"/>
  </g>
  <g transform="translate(120 150)">
    <!-- wings -->
    <g class="wing-l" style="transform-origin:-14px -34px">
      <ellipse cx="-34" cy="-52" rx="34" ry="20" fill="#eaf7ff" stroke="#6bb6e6" stroke-width="3" opacity=".95" transform="rotate(-18)"/>
      <path d="M-58 -58q24 -6 46 2" fill="none" stroke="#6bb6e6" stroke-width="2" opacity=".6" transform="rotate(-18)"/>
    </g>
    <g class="wing-r" style="transform-origin:14px -34px">
      <ellipse cx="34" cy="-52" rx="34" ry="20" fill="#eaf7ff" stroke="#6bb6e6" stroke-width="3" opacity=".95" transform="rotate(18)"/>
      <path d="M12 -56q22 -8 46 -2" fill="none" stroke="#6bb6e6" stroke-width="2" opacity=".6" transform="rotate(18)"/>
    </g>
    <!-- body -->
    <ellipse cx="0" cy="10" rx="62" ry="46" fill="#f6c21a" stroke="#2b2416" stroke-width="5"/>
    <path d="M-30 -30q10 40 0 80M0 -36q12 46 0 92M30 -30q10 40 0 80" fill="none" stroke="#2b2416" stroke-width="14" stroke-linecap="round"/>
    <path d="M62 8l20 4" stroke="#2b2416" stroke-width="7" stroke-linecap="round"/>
    <!-- face -->
    <circle cx="-34" cy="-2" r="7" fill="#2b2416"/>
    <circle cx="-37" cy="-5" r="2.5" fill="#fff"/>
    <circle cx="-10" cy="-2" r="7" fill="#2b2416"/>
    <circle cx="-13" cy="-5" r="2.5" fill="#fff"/>
    <path d="M-40 16q18 16 38 0" fill="none" stroke="#2b2416" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-48" cy="14" r="6" fill="#f08c6a" opacity=".55"/>
    <circle cx="4" cy="14" r="6" fill="#f08c6a" opacity=".55"/>
    <!-- antennae -->
    <path d="M-28 -44q-10 -26 -30 -34M-6 -46q-2 -26 8 -40" fill="none" stroke="#2b2416" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-59" cy="-79" r="6" fill="#2b2416"/>
    <circle cx="3" cy="-87" r="6" fill="#2b2416"/>
    <!-- graduation cap -->
    <g transform="translate(-22 -62) rotate(-8)">
      <path d="M-46 0l46 -18 46 18-46 18z" fill="#2b2416"/>
      <path d="M-26 8v16q26 14 52 0v-16" fill="#3a3121" stroke="#2b2416" stroke-width="3"/>
      <path d="M0 -18v30" stroke="#2b2416" stroke-width="2"/>
      <path d="M44 2v22" stroke="#f6c21a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="44" cy="26" r="4" fill="#f6c21a"/>
    </g>
  </g>
</svg>
